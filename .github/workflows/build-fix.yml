name: Build Search Fix

on:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Remove hardcoded buildPython path
        run: sed -i '\|buildPython("D:/Programs/Python/Python38/python.exe")|d' pyramid/build.gradle

      - name: Create empty local.properties
        run: echo "" > local.properties

      - name: Build java64 release
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleJava64Release --build-cache --parallel --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-java64-unsigned
          path: app/build/outputs/apk/java64/release/*.apk
