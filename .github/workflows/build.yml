name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "# CI environment; SDK resolved from ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleJava64Debug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-java64-debug
          path: app/build/outputs/apk/java64/debug/*.apk
          if-no-files-found: error
          retention-days: 30
